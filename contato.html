  <!-- Parte principal da página, com meu formulário de contato -->
  <main>
    <h1>Fale Comigo</h1>

    <!-- Aqui é só a parte visual do formulário, como a atividade pediu -->
    <form>
      <!-- Nome da pessoa que vai me enviar mensagem -->
      <label for="nome">Nome:</label><br>
      <input type="text" id="nome" name="nome"><br><br>

      <!-- E-mail da pessoa -->
      <label for="email">E-mail:</label><br>
      <input type="email" id="email" name="email"><br><br>

      <!-- Espaço para escrever a mensagem -->
      <label for="mensagem">Mensagem:</label><br>
      <textarea id="mensagem" name="mensagem" rows="5"></textarea><br><br>

      <!-- Botão para enviar (não está funcional, é só visual mesmo) -->
      <button type="submit">Enviar</button>
    </form>
  </main>
